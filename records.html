<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales and Expenses</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Helping Small Vendors Go Digital</h1>
    <p>Simple digital solutions for small businesses</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="vendor.html">Vendor Details</a>
    <a href="survey.html">Survey</a>
    <a href="records.html">Records</a>
    <a href="report.html">Report</a>
    <a href="safety.html">Safety</a>
</nav>

<main>
    <h2>Sales and Expense Records</h2>
    <p>Enter your daily sales and expenses below.</p>

   <form onsubmit="saveRecord(event)">
  <div class="mb-3">
    <label class="form-label">Today's Sales Amount (₹):</label>
    <input type="number" id="salesInput" class="form-control" placeholder="Enter sales" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Today's Expense Amount (₹):</label>
    <input type="number" id="expenseInput" class="form-control" placeholder="Enter expenses" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Date:</label>
    <input type="date" id="dateInput" class="form-control" required>
  </div>
  <button type="submit" class="btn btn-success">Save Record</button>
</form>
</main>

<footer>
    <p>TYIT CEP  | Helping Small Vendors Go Digital</p>
</footer>

<script>
const form = document.getElementById("recordsForm");

form.addEventListener("submit", async e => {
    e.preventDefault();

    const data = {
        sale: document.getElementById("sale").value,
        expense: document.getElementById("expense").value,
        record_date: document.getElementById("record_date").value
    };

    try {
        const response = await fetch("/api/records", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        const result = await response.json();
        alert(result.message);

        if (response.ok) form.reset();

    } catch (error) {
        alert("Something went wrong. Please try again.");
    }
});
</script>
    <script>
  function saveRecord(event) {
    event.preventDefault(); // Prevents page reload

    const sales = parseFloat(document.getElementById('salesInput').value) || 0;
    const expenses = parseFloat(document.getElementById('expenseInput').value) || 0;

    // Fetch existing totals from browser memory (or start at 0)
    let currentSales = parseFloat(localStorage.getItem('totalSales')) || 0;
    let currentExpenses = parseFloat(localStorage.getItem('totalExpenses')) || 0;

    // Add new values to running totals
    localStorage.setItem('totalSales', (currentSales + sales).toFixed(2));
    localStorage.setItem('totalExpenses', (currentExpenses + expenses).toFixed(2));

    alert('Record saved successfully! Your report will now reflect these numbers.');

    // Reset input fields
    document.getElementById('salesInput').value = '';
    document.getElementById('expenseInput').value = '';
  }
</script>

</body>
</html>
