<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales and Expenses</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Helping Small Vendors Go Digital</h1>
    <p>Simple digital solutions for small businesses</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="vendor.html">Vendor Details</a>
    <a href="survey.html">Survey</a>
    <a href="records.html">Records</a>
    <a href="report.html">Report</a>
    <a href="safety.html">Safety</a>
</nav>

<main>
    <h2>Sales and Expense Records</h2>
    <p>Enter your daily sales and expenses below.</p>

    <form id="recordsForm">
        <div class="mb-3">
            <label class="form-label">Today's Sales Amount (₹):</label>
            <input type="number" step="0.01" id="salesInput" class="form-control" placeholder="Enter sales" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Today's Expense Amount (₹):</label>
            <input type="number" step="0.01" id="expenseInput" class="form-control" placeholder="Enter expenses" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Date:</label>
            <input type="date" id="dateInput" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success">Save Record</button>
    </form>
</main>

<footer>
    <p>SYIT CEP | Helping Small Vendors Go Digital</p>
</footer>

<script>
const form = document.getElementById("recordsForm");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const data = {
        sale: parseFloat(document.getElementById("salesInput").value) || 0,
        expense: parseFloat(document.getElementById("expenseInput").value) || 0,
        record_date: document.getElementById("dateInput").value
    };

    try {
        const response = await fetch("/api/records", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        const result = await response.json();
        
        if (response.ok) {
            alert(result.message || "Record saved successfully!");
            form.reset();
        } else {
            alert("Error: " + (result.message || "Failed to save record"));
        }
    } catch (error) {
        console.error("Error submitting record:", error);
        alert("Something went wrong. Please try again.");
    }
});
</script>

</body>
</html>
