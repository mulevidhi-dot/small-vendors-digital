<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales and Expenses</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Helping Small Vendors Go Digital</h1>
    <p>Simple digital solutions for small businesses</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="vendor.html">Vendor Details</a>
    <a href="survey.html">Survey</a>
    <a href="records.html">Records</a>
    <a href="report.html">Report</a>
    <a href="safety.html">Safety</a>
</nav>

<main>
    <h2>Sales and Expense Records</h2>
    <p>Enter your daily sales and expenses below.</p>

    <form id="recordsForm">

        <label>Today's Sales Amount (₹):</label>
        <input type="number" id="sale" min="0" required>

        <label>Today's Expense Amount (₹):</label>
        <input type="number" id="expense" min="0" required>

        <label>Date:</label>
        <input type="date" id="record_date" required>

        <button type="submit">Save Record</button>

    </form>
</main>

<footer>
    <p>TYIT CEP  | Helping Small Vendors Go Digital</p>
</footer>

<script>
const form = document.getElementById("recordsForm");

form.addEventListener("submit", async e => {
    e.preventDefault();

    const data = {
        sale: document.getElementById("sale").value,
        expense: document.getElementById("expense").value,
        record_date: document.getElementById("record_date").value
    };

    try {
        const response = await fetch("/api/records", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        const result = await response.json();
        alert(result.message);

        if (response.ok) form.reset();

    } catch (error) {
        alert("Something went wrong. Please try again.");
    }
});
</script>

</body>
</html>
